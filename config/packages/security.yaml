security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_signin
                check_path: app_signin
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/parent, roles: ROLE_PARENT }
        - { path: ^/enfant, roles: ROLE_ENFANT }
        - { path: ^/professeur, roles: ROLE_PROFESSEUR }
        - { path: ^/psychologue, roles: ROLE_PSYCHOLOGUE }
        - { path: ^/signin, roles: PUBLIC_ACCESS }
        - { path: ^/signup, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_PARENT, ROLE_PROFESSEUR, ROLE_PSYCHOLOGUE, ROLE_ENFANT]
        ROLE_PARENT: []
        ROLE_PROFESSEUR: []
        ROLE_PSYCHOLOGUE: []
        ROLE_ENFANT: []